
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ken's iPhone</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 12px;
  background: #101114;
}

.phone {
  position: relative;
  width: min(360px, calc(100vw - 44px), calc((100dvh - 70px) * 0.48));
  aspect-ratio: 9 / 19.5;
  height: auto;
  flex-shrink: 0;
  overflow: hidden;
  background: #222;
  border: 7px solid #17191b;
  border-radius: 48px;
  box-shadow:
    0 0 0 2px #53575a,
    0 0 0 4px #242729,
    0 20px 55px rgba(0,0,0,.65),
    inset 0 0 0 2px #000;
}

.phone::before {
  content: "";
  position: absolute;
  top: 18%;
  left: -10px;
  width: 4px;
  height: 65px;
  border-radius: 3px;
  background: #666b70;
  box-shadow: 0 85px 0 #666b70;
  z-index: 10;
}

.phone::after {
  content: "";
  position: absolute;
  top: 27%;
  right: -10px;
  width: 4px;
  height: 85px;
  border-radius: 3px;
  background: #666b70;
  z-index: 10;
}
  
.wallpaper {
  position: absolute;
  inset: 0;
  background: url("IMG_6568.jpeg") center/cover no-repeat;
}
.shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,rgba(0,0,0,.35),transparent 45%,rgba(0,0,0,.3));
}
.status {
  position: absolute;
  top: 18px;
  width: 100%;
  padding: 0 28px;
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 600;
}
.island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 32px;
  border-radius: 30px;
  background: black;
}
.clock {
  position: absolute;
  top: 14%;
  width: 100%;
  text-align: center;
}
.date { font-size: 20px; 
 text-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
  }
.time {
  font-size: 86px;
  font-weight: 200;
  letter-spacing: -4px;
  text-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
}
.bottom {
  position: absolute;
  bottom: 32px;
  width: 100%;
  text-align: center;
  font-size: 15px;
}
.homebar {
  width: 130px;
  height: 5px;
  background: white;
  border-radius: 8px;
  margin: 20px auto 0;
}
.passcode {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(15,17,21,.93);
  text-align: center;
  flex-direction: column;
  align-items: center;
  padding-top: 24vh;
}
.dots {
  font-size: 30px;
  letter-spacing: 12px;
  margin: 25px 0;
}
.keypad {
  display: grid;
  grid-template-columns: repeat(3,70px);
  justify-content: center;
  gap: 15px;
}
.keypad button {
  width: 70px;
  height: 70px;
  border: 0;
  border-radius: 50%;
  background: #44474d;
  color: white;
  font-size: 28px;
}
@keyframes wrongShake {

  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}
  #passcode {
  color: white !important;
}

#dots {
  color: white !important;
}
  
/* LINE notifications */
.line-stack {
  position: absolute;
  top: 245px;
  left: 5%;
  width: 90%;
  z-index: 15;
  cursor: pointer;
}

.line-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  min-height: 62px;
  box-sizing: border-box;
  border-radius: 18px;
  background: rgba(210, 215, 225, 0.35);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  color: white;
  
border: 1px solid rgba(255, 255, 255, 0.28);
box-shadow:
  0 8px 24px rgba(0, 0, 0, 0.20),
  0 2px 6px rgba(0, 0, 0, 0.12),
  inset 0 1px 0 rgba(255, 255, 255, 0.22);

  transition: margin 0.35s ease, transform 0.35s ease;
}

.line-card + .line-card {
  margin-top: -49px;
}

.line-card:nth-child(2) {
  transform: scale(0.96);
}

.line-card:nth-child(3) {
  transform: scale(0.92);
}

.line-stack.expanded .line-card {
  margin-top: 8px;
  transform: scale(1);
}

.line-stack.expanded .line-card:nth-child(2) {
  transition-delay: 0.12s;
}

.line-stack.expanded .line-card:nth-child(3) {
  transition-delay: 0.28s;
}

.line-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.line-text {
  min-width: 0;
  flex: 1;
  font-size: 13px;
}

.line-name {
  font-weight: 700;
  margin-bottom: 4px;
}

.line-message {
  font-size: 12px;
}

.line-card:not(:first-child) .line-text {
  opacity: 1;
}

.line-stack.expanded .line-text {
  opacity: 1;
}

.line-avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.line-logo {
  position: absolute;
  right: -3px;
  bottom: 0;
  background: #06c755;
  color: white;
  border-radius: 5px;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  font-size: 6px;
  font-weight: bold;
}

/* Prevent page scrolling when swiping the phone */
html, body {
  overscroll-behavior: none;
}

.phone {
  touch-action: pan-x;
  overscroll-behavior: contain;
}

/* iPhone-style font */
.phone {
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Helvetica Neue", sans-serif;
  color: white;
}

.clock .time {
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", sans-serif;
  font-weight: 800;
  letter-spacing: -3px;
}

.clock .date {
  font-weight: 600;
}

.line-name {
  font-weight: 700;
}

.line-message {
  font-weight: 500;
}

.bottom {
  font-weight: 500;
}

/* Cancel button */
.passcode {
  position: absolute;
}

.cancel-btn {
  position: absolute;
  bottom: 35px;
  right: 25px;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  z-index: 10;
}

/* Lock screen flashlight and camera */
.lock-actions {
  position: absolute;
  bottom: 45px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 8;
  pointer-events: none;
}

.lock-action {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(50,50,50,0.35);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  pointer-events: auto;
  cursor: pointer;
}

/* Smooth lock screen transition */
.line-stack {
  transition: opacity 0.35s ease, transform 0.35s ease;
}
  .line-stack.is-hiding {
  pointer-events: none;
}

.passcode {
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.passcode.is-entering {
  opacity: 0;
  transform: translateY(70px);
}

.passcode.is-visible {
  opacity: 1;
  transform: translateY(0);
}
/* Notification Center */
.notification-center {
  display: none;
  position: absolute;
  top: 48%;
  left: 5%;
  width: 90%;
  max-height: 37%;
  overflow-y: auto;
  z-index: 5;

.notification-heading {

}

.ken-notification {

}

.ken-app-icon {

.calendar-icon {

.calendar-icon span {

.calendar-icon strong {

}

.reminder-icon {

.missed-icon {

}

.ken-notification-text {
  display: flex;

  gap: 4px;
  min-width: 0;
  font-size: 12px;
}

.ken-notification-text strong {
  font-size: 13px;
  font-weight: 700;
}
  
/* Small notifications below James */
.ken-notifications {

/* iPhone Calendar Icon */
.ken-app-icon.calendar-icon {

.calendar-day {

}


/* iPhone Phone Icon */
.ken-app-icon.missed-icon {

}

.ken-app-icon.missed-icon svg {
  display: block;
  flex-shrink: 0;
}

/* Calendar icon final adjustment */
.ken-app-icon.calendar-icon {
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0;
}

.ken-app-icon.calendar-icon .calendar-day {
  color: #e34b48;
  font-size: 8px;

.ken-app-icon.calendar-icon .calendar-date {
  color: #000000;
  font-size: 16px;
  font-weight: 600;
  line-height: 20px;
  margin: 0;
  transform: translateY(-3px);
}

}

</style>
</head>

<script>
  





function cancelPasscode() {
  const passcode = document.getElementById("passcode");
  const stack = document.getElementById("lineStack");
  const clock = document.querySelector(".clock");
  const actions = document.querySelector(".lock-actions");
  const notifications = document.getElementById("kenNotifications");


  passcode.style.pointerEvents = "none";
  passcode.classList.remove("is-visible");
  passcode.classList.add("is-entering");

  setTimeout(() => {
    passcode.style.display = "none";
    passcode.classList.remove("is-entering");

    // คืนกล่องเจมส์โดยไม่เรียกแอนิเมชันซ่อนซ้ำ
    stack.style.transition = "none";
    stack.style.display = "";
    
if (notifications) {
  notifications.style.transition = "none";
  notifications.style.display = "flex";
  notifications.style.transform = "translateY(0)";
  notifications.style.opacity = "1";
  notifications.style.pointerEvents = "auto";
  requestAnimationFrame(() => {
    updateNotificationPosition();
  });
}

    stack.classList.remove("expanded", "is-hiding");
    stack.style.transform = "translateY(0)";
    stack.style.opacity = "1";
    stack.style.pointerEvents = "auto";

    // คืนวันที่และเวลา
    clock.style.transition = "none";
    clock.style.display = "";
    clock.style.transform = "translateY(0)";
    clock.style.opacity = "1";

    actions.style.display = "flex";
    actions.style.opacity = "1";
    actions.style.pointerEvents = "auto";

    requestAnimationFrame(() => {
      stack.style.transition = "";
      clock.style.transition = "";
    });

    passcode.style.pointerEvents = "auto";
    pin = "";
    document.getElementById("dots").textContent = "○○○○";
  }, 350);
}



const now = new Date();
document.getElementById("time").textContent =
  now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
document.getElementById("smalltime").textContent =
  document.getElementById("time").textContent;
document.getElementById("date").textContent =
  now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

let pin = "";


function unlock() {
  const passcode = document.getElementById("passcode");
  const stack = document.getElementById("lineStack");
  const clock = document.querySelector(".clock");
  const actions = document.querySelector(".lock-actions");
  const notifications = document.getElementById("kenNotifications");
  if (passcode.style.display === "flex") return;

  // ให้วันที่ เวลา และข้อความเจมส์เลื่อนขึ้นพร้อมกัน
  clock.style.transition = "transform 0.4s ease, opacity 0.4s ease";
  stack.style.transition = "transform 0.4s ease, opacity 0.4s ease";

  clock.style.transform = "translateY(-80px)";
  clock.style.opacity = "0";

  stack.style.transform = "translateY(-80px)";
  stack.style.opacity = "0";
  
if (notifications) {
  notifications.style.transition = "transform 0.4s ease, opacity 0.4s ease";
  notifications.style.transform = "translateY(-80px)";
  notifications.style.opacity = "0";
  notifications.style.pointerEvents = "none";
}

  stack.style.pointerEvents = "none";

  actions.style.opacity = "0";
  actions.style.pointerEvents = "none";

  setTimeout(() => {
    clock.style.display = "none";
    stack.style.display = "none";
    
if (notifications) notifications.style.display = "none";

    actions.style.display = "none";

    passcode.classList.remove("is-visible");
    passcode.classList.add("is-entering");
    passcode.style.display = "flex";

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        passcode.classList.remove("is-entering");
        passcode.classList.add("is-visible");
      });
    });
  }, 400);
}


  


function handleLineTap(event) {
  event.stopPropagation();

  const stack = document.getElementById("lineStack");

  if (!stack.classList.contains("expanded")) {
    stack.classList.add("expanded");

    const start = performance.now();

    function followNotifications() {
      updateNotificationPosition();

      if (performance.now() - start < 700) {
        requestAnimationFrame(followNotifications);
      }
    }

    requestAnimationFrame(followNotifications);

  } else {
    unlock();
  }
}



function updateNotificationPosition() {
  const stack = document.getElementById("lineStack");
  const notifications = document.getElementById("kenNotifications");
  const phone = document.querySelector(".phone");
  const actions = document.querySelector(".lock-actions");

  if (!stack || !notifications || !phone || !actions) return;

  const phoneRect = phone.getBoundingClientRect();
  const stackRect = stack.getBoundingClientRect();
  const actionsRect = actions.getBoundingClientRect();

  const top = stackRect.bottom - phoneRect.top + 10;
  const available = actionsRect.top - stackRect.bottom - 24;

  notifications.style.position = "absolute";
  notifications.style.top = top + "px";
  notifications.style.left = "5%";
  notifications.style.width = "90%";
  notifications.style.margin = "0";
  notifications.style.maxHeight = "none";

  
  notifications.style.overflowY = "visible";

  notifications.style.transition = "none";

}

window.addEventListener("load", () => {
  requestAnimationFrame(() => {
    updateNotificationPosition();
  });
});

function press(n){
  pin += n;
  document.getElementById("dots").textContent =
    "●".repeat(pin.length)+"○".repeat(4-pin.length);
  if(pin.length===4){
    if(pin==="1234"){
      document.querySelector(".phone").innerHTML =
        '<div style="padding:90px 20px;text-align:center"><h1>Ken\'s iPhone</h1><p>Unlocked ✓</p></div>';
    } else {
      const dots = document.getElementById("dots");

dots.style.animation = "none";
void dots.offsetWidth;
dots.style.animation = "wrongShake 0.4s ease";

setTimeout(() => {
    pin = "";
    dots.textContent = "○○○○";
    dots.style.animation = "";
}, 600);
    }
  }
}
const keys=document.getElementById("keys");
[1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(n=>{
  const b=document.createElement("button");
  b.textContent=n;
  b.onclick=()=>{
    if(n==="⌫"){
      pin=pin.slice(0,-1);
      document.getElementById("dots").textContent=
        "●".repeat(pin.length)+"○".repeat(4-pin.length);
    } else if(n!=="") press(String(n));
  };
  keys.appendChild(b);
});
  
let touchStartY = 0;

const phoneScreen = document.querySelector(".phone");

phoneScreen.addEventListener("touchstart", function(e) {
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

phoneScreen.addEventListener("touchend", function(e) {
  const touchEndY = e.changedTouches[0].screenY;

  if (touchStartY - touchEndY > 50) {
    unlock();
  }
}, { passive: true });

</script>
</body>
</html>
