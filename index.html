
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ken's iPhone</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 12px;
  background: #101114;
}

.phone {
  position: relative;
  width: min(360px, calc(100vw - 44px), calc((100dvh - 70px) * 0.48));
  aspect-ratio: 9 / 19.5;
  height: auto;
  flex-shrink: 0;
  overflow: hidden;
  background: #222;
  border: 7px solid #17191b;
  border-radius: 48px;
  box-shadow:
    0 0 0 2px #53575a,
    0 0 0 4px #242729,
    0 20px 55px rgba(0,0,0,.65),
    inset 0 0 0 2px #000;
}

.phone::before {
  content: "";
  position: absolute;
  top: 18%;
  left: -10px;
  width: 4px;
  height: 65px;
  border-radius: 3px;
  background: #666b70;
  box-shadow: 0 85px 0 #666b70;
  z-index: 10;
}

.phone::after {
  content: "";
  position: absolute;
  top: 27%;
  right: -10px;
  width: 4px;
  height: 85px;
  border-radius: 3px;
  background: #666b70;
  z-index: 10;
}
  
.wallpaper {
  position: absolute;
  inset: 0;
  background: url("IMG_6568.jpeg") center/cover no-repeat;
}
.shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,rgba(0,0,0,.35),transparent 45%,rgba(0,0,0,.3));
}
.status {
  position: absolute;
  top: 18px;
  width: 100%;
  padding: 0 28px;
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 600;
}
.island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 32px;
  border-radius: 30px;
  background: black;
}
.clock {
  position: absolute;
  top: 14%;
  width: 100%;
  text-align: center;
}
.date { font-size: 20px; }
.time {
  font-size: 86px;
  font-weight: 200;
  letter-spacing: -4px;
}
.bottom {
  position: absolute;
  bottom: 32px;
  width: 100%;
  text-align: center;
  font-size: 15px;
}
.homebar {
  width: 130px;
  height: 5px;
  background: white;
  border-radius: 8px;
  margin: 20px auto 0;
}
.passcode {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(15,17,21,.93);
  text-align: center;
  padding-top: 24vh;
}
.dots {
  font-size: 30px;
  letter-spacing: 12px;
  margin: 25px 0;
}
.keypad {
  display: grid;
  grid-template-columns: repeat(3,70px);
  justify-content: center;
  gap: 15px;
}
.keypad button {
  width: 70px;
  height: 70px;
  border: 0;
  border-radius: 50%;
  background: #44474d;
  color: white;
  font-size: 28px;
}
@keyframes wrongShake {

  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}
  #passcode {
  color: white !important;
}

#dots {
  color: white !important;
}
  
/* LINE notifications */
.line-stack {
  position: absolute;
  top: 245px;
  left: 5%;
  width: 90%;
  z-index: 15;
  cursor: pointer;
}

.line-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  min-height: 62px;
  box-sizing: border-box;
  border-radius: 18px;
  background: rgba(210, 215, 225, 0.35);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  color: white;
  
border: 1px solid rgba(255, 255, 255, 0.28);
box-shadow:
  0 8px 24px rgba(0, 0, 0, 0.20),
  0 2px 6px rgba(0, 0, 0, 0.12),
  inset 0 1px 0 rgba(255, 255, 255, 0.22);

  transition: margin 0.35s ease, transform 0.35s ease;
}

.line-card + .line-card {
  margin-top: -49px;
}

.line-card:nth-child(2) {
  transform: scale(0.96);
}

.line-card:nth-child(3) {
  transform: scale(0.92);
}

.line-stack.expanded .line-card {
  margin-top: 8px;
  transform: scale(1);
}

.line-stack.expanded .line-card:nth-child(2) {
  transition-delay: 0.12s;
}

.line-stack.expanded .line-card:nth-child(3) {
  transition-delay: 0.28s;
}

.line-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.line-text {
  min-width: 0;
  flex: 1;
  font-size: 13px;
}

.line-name {
  font-weight: 700;
  margin-bottom: 4px;
}

.line-message {
  font-size: 12px;
}

.line-card:not(:first-child) .line-text {
  opacity: 1;
}

.line-stack.expanded .line-text {
  opacity: 1;
}

.line-avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.line-logo {
  position: absolute;
  right: -3px;
  bottom: 0;
  background: #06c755;
  color: white;
  border-radius: 50%;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  font-size: 6px;
  font-weight: bold;
}

/* Prevent page scrolling when swiping the phone */
html, body {
  overscroll-behavior: none;
}

.phone {
  touch-action: pan-x;
  overscroll-behavior: contain;
}

/* iPhone-style font */
.phone {
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Helvetica Neue", sans-serif;
  color: white;
}

.clock .time {
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", sans-serif;
  font-weight: 800;
  letter-spacing: -3px;
}

.clock .date {
  font-weight: 600;
}

.line-name {
  font-weight: 700;
}

.line-message {
  font-weight: 500;
}

.bottom {
  font-weight: 500;
}

/* Cancel button */
.passcode {
  position: absolute;
}

.cancel-btn {
  position: absolute;
  bottom: 35px;
  right: 25px;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  z-index: 10;
}

/* Lock screen flashlight and camera */
.lock-actions {
  position: absolute;
  bottom: 65px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 8;
  pointer-events: none;
}

.lock-action {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(50,50,50,0.35);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  pointer-events: auto;
  cursor: pointer;
}

/* Smooth lock screen transition */
.line-stack {
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.line-stack.is-hiding {
  opacity: 0;
  transform: translateY(-18px);
  pointer-events: none;
}

.passcode {
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.passcode.is-entering {
  opacity: 0;
  transform: translateY(70px);
}

.passcode.is-visible {
  opacity: 1;
  transform: translateY(0);
}

</style>
</head>
<body>
<div class="phone">
  <div class="wallpaper"></div>
  <div class="shade"></div>
  <div class="island"></div>
  <div class="status">
    <span id="smalltime">9:41</span>
    
<span style="display:flex;align-items:center;gap:6px">
  <svg width="19" height="15" viewBox="0 0 19 15" fill="white">
    <rect x="1" y="10" width="3" height="5" rx="1"/>
    <rect x="6" y="7" width="3" height="8" rx="1"/>
    <rect x="11" y="4" width="3" height="11" rx="1"/>
    <rect x="16" y="1" width="3" height="14" rx="1"/>
  </svg>
  <svg width="20" height="16" viewBox="0 0 24 20" fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
    <path d="M2 7 Q12 -2 22 7"/>
    <path d="M6 11 Q12 6 18 11"/>
    <path d="M10 15 Q12 13 14 15"/>
  </svg>
  <span style="background:white;color:#111;border-radius:5px;padding:1px 4px;font-size:12px;font-weight:800">93</span>
</span>

  </div>
  <div class="clock" onclick="unlock()">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </div>
  
<div class="line-stack" id="lineStack" onclick="handleLineTap(event)">

  <div class="line-card">
    <div class="line-avatar-wrap">
      <img class="line-avatar" src="IMG_6600.jpeg">
      <span class="line-logo">LINE</span>
    </div>
    <div class="line-text">
      <div class="line-name">สารวัตรเจมส์🤍</div>
      <div class="line-message">คิดถึงเคนครับ🥺</div>
    </div>
  </div>

  <div class="line-card">
    <div class="line-avatar-wrap">
      <img class="line-avatar" src="IMG_6600.jpeg">
      <span class="line-logo">LINE</span>
    </div>
    <div class="line-text">
      <div class="line-name">สารวัตรเจมส์🤍</div>
      <div class="line-message">วันนี้เหนื่อยไหมครับ</div>
    </div>
  </div>

  <div class="line-card">
    <div class="line-avatar-wrap">
      <img class="line-avatar" src="IMG_6600.jpeg">
      <span class="line-logo">LINE</span>
    </div>
    <div class="line-text">
      <div class="line-name">สารวัตรเจมส์🤍</div>
      <div class="line-message">เลิกงานแล้วผมไปรับนะ</div>
    </div>
  </div>

</div>

<div class="lock-actions">
  <button class="lock-action" type="button" aria-label="Flashlight">
    <svg viewBox="0 0 24 24" fill="currentColor" width="25" height="25">
      <path d="M7 2h10v5l-3.5 4v9a2.5 2.5 0 0 1-5 0v-9L7 7V2zm2 2v2h6V4H9z"/>
    </svg>
  </button>
  <button class="lock-action" type="button" aria-label="Camera">
    <svg viewBox="0 0 24 24" fill="currentColor" width="27" height="27">
      <path d="M9 3 7.5 5H4a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3h-3.5L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
    </svg>
  </button>
</div>

  <div class="bottom" onclick="unlock()">
    Swipe up to unlock
    <div class="homebar"></div>
  </div>
  <div class="passcode" id="passcode">
    <div>Enter Passcode</div>
    <div class="dots" id="dots">○○○○</div>
    <div class="keypad" id="keys"></div>
  <button class="cancel-btn" onclick="cancelPasscode()">Cancel</button>
</div>
</div>
<script>
  


function cancelPasscode() {
  const passcode = document.getElementById("passcode");
  const stack = document.getElementById("lineStack");
  const actions = document.querySelector(".lock-actions");

  passcode.style.display = "none";
  passcode.classList.remove("is-entering", "is-visible");

  stack.style.display = "";
  stack.classList.remove("is-hiding", "expanded");

  actions.style.display = "flex";
  actions.style.opacity = "1";
  actions.style.pointerEvents = "auto";

  pin = "";
  document.getElementById("dots").textContent = "○○○○";
}

const now = new Date();
document.getElementById("time").textContent =
  now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
document.getElementById("smalltime").textContent =
  document.getElementById("time").textContent;
document.getElementById("date").textContent =
  now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

let pin = "";

function unlock() {
  const passcode = document.getElementById("passcode");
  const stack = document.getElementById("lineStack");
  const actions = document.querySelector(".lock-actions");

  if (passcode.style.display === "flex") return;

  stack.classList.add("is-hiding");
  actions.style.opacity = "0";
  actions.style.pointerEvents = "none";

  setTimeout(() => {
    stack.style.display = "none";
    actions.style.display = "none";

    passcode.classList.remove("is-visible");
    passcode.classList.add("is-entering");
    passcode.style.display = "flex";

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        passcode.classList.remove("is-entering");
        passcode.classList.add("is-visible");
      });
    });
  }, 350);
}

  
function handleLineTap(event) {
  event.stopPropagation();

  const stack = document.getElementById("lineStack");

  if (!stack.classList.contains("expanded")) {
    stack.classList.add("expanded");
  } else {
    unlock();
  }
}

function press(n){
  pin += n;
  document.getElementById("dots").textContent =
    "●".repeat(pin.length)+"○".repeat(4-pin.length);
  if(pin.length===4){
    if(pin==="1234"){
      document.querySelector(".phone").innerHTML =
        '<div style="padding:90px 20px;text-align:center"><h1>Ken\'s iPhone</h1><p>Unlocked ✓</p></div>';
    } else {
      const dots = document.getElementById("dots");

dots.style.animation = "none";
void dots.offsetWidth;
dots.style.animation = "wrongShake 0.4s ease";

setTimeout(() => {
    pin = "";
    dots.textContent = "○○○○";
    dots.style.animation = "";
}, 600);
    }
  }
}
const keys=document.getElementById("keys");
[1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(n=>{
  const b=document.createElement("button");
  b.textContent=n;
  b.onclick=()=>{
    if(n==="⌫"){
      pin=pin.slice(0,-1);
      document.getElementById("dots").textContent=
        "●".repeat(pin.length)+"○".repeat(4-pin.length);
    } else if(n!=="") press(String(n));
  };
  keys.appendChild(b);
});
  
let touchStartY = 0;

const phoneScreen = document.querySelector(".phone");

phoneScreen.addEventListener("touchstart", function(e) {
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

phoneScreen.addEventListener("touchend", function(e) {
  const touchEndY = e.changedTouches[0].screenY;

  if (touchStartY - touchEndY > 50) {
    unlock();
  }
}, { passive: true });

</script>
</body>
</html>
